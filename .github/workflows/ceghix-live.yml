name: CEGHIX live
on:
  schedule:
    - cron: "30 16,19 * * 1-5"  # nach CEGH-Publikation ~18–21 Uhr CE(S)T
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update-ceghix.py
      - run: cp index.html docs/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ceghix.csv docs/data/ceghix.csv docs/index.html
          git diff --cached --quiet || git commit -m "chore: CEGHIX live nachziehen"
          git push
